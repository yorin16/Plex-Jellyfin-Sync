server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so upstreams are re-resolved after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vue SPA — proxy to frontend container
    location / {
        set $upstream_fe http://frontend:80;
        proxy_pass $upstream_fe;
        proxy_set_header Host $host;
    }

    # API — proxy to PHP-FPM
    location /api {
        set $upstream_php php:9000;
        fastcgi_pass $upstream_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300;
    }

    # Symfony public assets
    location /bundles {
        root /var/www/html/public;
        expires 7d;
    }

    client_max_body_size 16M;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
