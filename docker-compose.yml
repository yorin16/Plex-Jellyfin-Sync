services:
  php:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/html
      - ${PLEX_MEDIA_PATH:-/mnt/user/Media/Movies}:/var/media/source:ro
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER:-media_sync}:${DB_PASSWORD}@${MYSQL_HOST:-MariaDB-Official}:3306/${DB_NAME:-media_sync}?serverVersion=${MARIADB_VERSION:-mariadb-10.11}&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    networks:
      - app_network
    restart: unless-stopped

  worker:
    build:
      context: ./docker/php
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    volumes:
      - ./backend:/var/www/html
      - ${PLEX_MEDIA_PATH:-/mnt/user/Media/Movies}:/var/media/source:ro
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER:-media_sync}:${DB_PASSWORD}@${MYSQL_HOST:-MariaDB-Official}:3306/${DB_NAME:-media_sync}?serverVersion=${MARIADB_VERSION:-mariadb-10.11}&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    depends_on:
      - php
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - php
      - frontend
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    external: true
    name: ${DOCKER_NETWORK:-hosting_network}
